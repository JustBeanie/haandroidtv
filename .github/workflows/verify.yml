name: Verify Android TV app

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew lintDebug
      - run: ./gradlew testDebugUnitTest koverXmlReportDebug koverVerifyDebug :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  tv-emulator:
    needs: unit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Android TV smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb wait-for-device shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 1; done;'
            sleep 30
            ./gradlew :app:connectedDebugAndroidTest
            ./gradlew :benchmark:connectedBenchmarkReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.dryRunMode.enable=true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tv-instrumentation-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            benchmark/build/outputs/connected_android_test_additional_output
            benchmark/build/reports/androidTests
            benchmark/build/outputs/androidTest-results
