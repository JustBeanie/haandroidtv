name: Verify Android TV app

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Self-test Shield validation helper
        shell: pwsh
        run: ./tools/validate-shield.ps1 -SelfTest
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - run: ./gradlew :app:lintDebug :app:lintRelease
      - run: ./gradlew testDebugUnitTest koverXmlReportDebug koverVerifyDebug :app:assembleDebug :app:assembleRelease
      - name: Verify TV release artifacts
        shell: pwsh
        run: ./tools/verify-release-artifacts.ps1 -Artifact app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  tv-ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 33
            arch: x86
          - api: 36
            arch: x86_64
    needs: unit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android TV smoke test
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          force-avd-creation: true
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            bash tools/wait-for-tv-emulator.sh
            bash tools/run-tv-tests.sh :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: tv-ui-reports-${{ matrix.api }}
          path: |
            build/tv-diagnostics
            app/build/reports/androidTests
            app/build/outputs/androidTest-results

  tv-benchmark-smoke:
    needs: unit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android TV benchmark smoke test
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: true
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            bash tools/wait-for-tv-emulator.sh
            bash tools/run-tv-tests.sh :benchmark:connectedBenchmarkReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.dryRunMode.enable=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: tv-benchmark-reports
          path: |
            build/tv-diagnostics
            benchmark/build/outputs/connected_android_test_additional_output
            benchmark/build/reports/androidTests
            benchmark/build/outputs/androidTest-results
